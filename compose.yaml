services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_team
      POSTGRES_USER: ai_team
      POSTGRES_PASSWORD: ai_team_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_team -d ai_team"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

