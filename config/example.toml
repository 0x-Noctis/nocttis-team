[server]
bind = "127.0.0.1:7410"
data_dir = "./data"
# Origin web yang boleh memanggil API dari browser (eksplisit, tanpa wildcard, maksimal 8).
cors_allowed_origins = ["http://127.0.0.1:5173"]

[database]
max_connections = 10
acquire_timeout_seconds = 5

[scheduler]
max_parallel_agents = 2
heartbeat_seconds = 10
stale_after_seconds = 60

[budgets]
default_project_tokens = 300000
default_task_input_tokens = 30000
default_task_output_tokens = 8000
reserve_percent = 15

[git]
worktree_root = "./data/worktrees"
retention_hours = 24

[artifacts]
root = "./data/artifacts"
max_tool_output_bytes = 1048576

[runner]
network_enabled = false

[provider]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
